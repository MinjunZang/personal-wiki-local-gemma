[project]
name = "personal-wiki-cli"
version = "0.1.0"
description = "Personal wiki CLI with local Gemma (Ollama) and hybrid retrieval"
requires-python = ">=3.10"
dependencies = [
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "rank-bm25==0.2.2",
    "numpy>=2.0",
]

[project.scripts]
wiki = "wiki_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wiki_cli"]
